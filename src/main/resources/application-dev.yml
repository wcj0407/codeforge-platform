spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/codeforge?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  rabbitmq:
    host: 127.0.0.1
    port: 15673
    username: guest
    password: guest

    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
#写到配置文件中可以不明文表示出去
jwt:
#  密钥
  secret: codeforge-jwt-secret-key-2026-please-change-me-32+
#  过期时间
  expiration: 604800000
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n"



